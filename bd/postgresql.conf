# G7 — PostgreSQL 16 (carregado via -c config_file=...)
listen_addresses = '*'            # restrição real feita no pg_hba.conf + rede Docker interna
port = 5432
max_connections = 50              # PgBouncer concentra as conexões da aplicação
shared_buffers = 128MB

# Segurança
password_encryption = scram-sha-256
hba_file = '/etc/postgresql/pg_hba.conf'

# Timeouts exigidos
statement_timeout = '30s'
idle_in_transaction_session_timeout = '60s'
lock_timeout = '10s'

# Logs úteis para a demonstração
log_destination = 'stderr'
log_connections = on
log_disconnections = on
log_min_duration_statement = 500
log_line_prefix = '%t [%p] %u@%d '
timezone = 'America/Sao_Paulo'
