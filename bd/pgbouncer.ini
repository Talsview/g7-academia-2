; G7 — PgBouncer 1.22+ (sem segredos: o userlist é gerado em /tmp a partir de variáveis de ambiente)
[databases]
g7_academia = host=db port=5432 dbname=g7_academia

[pgbouncer]
listen_addr = 0.0.0.0
listen_port = 6432
auth_type = scram-sha-256
auth_file = /tmp/userlist.txt
pool_mode = transaction
max_client_conn = 100
default_pool_size = 10
min_pool_size = 2
reserve_pool_size = 2
; permite Prepared Statements (protocolo estendido) em modo transaction
max_prepared_statements = 100
ignore_startup_parameters = extra_float_digits
server_idle_timeout = 300
query_wait_timeout = 30
logfile = /dev/null
admin_users =
