# G7 — Docker Compose. Inicialização: docker compose up --build
# Serviços: db (PostgreSQL 16), pgbouncer (auxiliar obrigatório), backend (Spring Boot), frontend (Angular + Nginx)
name: g7-academia

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    command: ["postgres", "-c", "config_file=/etc/postgresql/postgresql.conf"]
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_INITDB_ARGS: "--auth-host=scram-sha-256 --auth-local=peer"
      APP_DB_USER: ${APP_DB_USER}
      APP_DB_PASSWORD: ${APP_DB_PASSWORD}
      LEITOR_DB_USER: ${LEITOR_DB_USER}
      LEITOR_DB_PASSWORD: ${LEITOR_DB_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./bd/postgresql.conf:/etc/postgresql/postgresql.conf:ro
      - ./bd/pg_hba.conf:/etc/postgresql/pg_hba.conf:ro
      - ./bd/backup.sql:/docker-entrypoint-initdb.d/01-backup.sql:ro
      - ./bd/init-usuarios.sh:/docker-entrypoint-initdb.d/02-usuarios.sh:ro
      - ./scripts:/scripts:ro
    ports:
      - "127.0.0.1:5433:5432"       # apenas localhost (uso opcional em desenvolvimento)
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 15
      start_period: 10s
    networks:
      g7net:
        ipv4_address: 172.28.0.10

  pgbouncer:
    image: edoburu/pgbouncer:latest
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DB_USER: ${APP_DB_USER}
      DB_PASSWORD: ${APP_DB_PASSWORD}
    # o userlist.txt é gerado em /tmp a partir das variáveis (sem segredo no repositório)
    entrypoint: ["/bin/sh", "-c", "printf '\"%s\" \"%s\"\\n' \"$$DB_USER\" \"$$DB_PASSWORD\" > /tmp/userlist.txt && exec pgbouncer /etc/pgbouncer/pgbouncer.ini"]
    volumes:
      - ./bd/pgbouncer.ini:/etc/pgbouncer/pgbouncer.ini:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -p 6432"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks:
      g7net:
        ipv4_address: 172.28.0.11

  backend:
    build: ./backend
    restart: unless-stopped
    depends_on:
      pgbouncer:
        condition: service_healthy
    environment:
      DB_URL: jdbc:postgresql://pgbouncer:6432/${POSTGRES_DB}
      DB_USER: ${APP_DB_USER}
      DB_PASSWORD: ${APP_DB_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}
      CORS_ALLOWED_ORIGIN: ${CORS_ALLOWED_ORIGIN}
    ports:
      - "127.0.0.1:8080:8080"       # apenas localhost (testes da API com curl)
    networks:
      - g7net

  frontend:
    build: ./frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "4200:80"
    networks:
      - g7net

volumes:
  pgdata:

networks:
  g7net:
    driver: bridge
    ipam:
      config:
        - subnet: 172.28.0.0/24
